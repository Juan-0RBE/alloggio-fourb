<div class="modal-overlay-resena" (click)="cancelarFormulario()">
  <div
    class="contenedor-formulario-resena"
    role="dialog"
    aria-modal="true"
    aria-labelledby="titulo-resena"
    (click)="$event.stopPropagation()"
  >
    <div class="encabezado-modal-resena">
      <h2 id="titulo-resena">Escribe tu reseña</h2>
      <p class="subtitulo-alojamiento">
        Comparte tu experiencia en <strong>{{ alojamientoTitulo }}</strong>
      </p>
      <button
        class="boton-cerrar"
        (click)="cancelarFormulario()"
        [disabled]="enviando"
        type="button"
        aria-label="Cerrar"
      >
        <i class="pi pi-times"></i>
      </button>
    </div>

    <hr class="divisor-resena" />

    <div class="cuerpo-formulario">
      <div class="fila-calificacion-principal">
        <div class="textos-calificacion">
          <span>Calificación general</span>
          <span class="texto-valor-calificacion" [class.sin-elegir]="calificacion === 0">{{
            textoCalificacion()
          }}</span>
        </div>
        <app-estrella
          [calificacion]="calificacion"
          [interactivo]="!enviando"
          (calificacionCambiada)="elegirCalificacion($event)"
        ></app-estrella>
      </div>
      <span class="error-campo" *ngIf="intentoEnviar && errorCalificacion()" role="alert">{{
        errorCalificacion()
      }}</span>

      <hr class="divisor-claro" />

      <div class="campo-comentario">
        <label for="comentario">Tu comentario</label>
        <textarea
          id="comentario"
          rows="5"
          [maxlength]="comentarioMax"
          [(ngModel)]="comentario"
          [disabled]="enviando"
          [class.invalido]="comentarioTocado && errorComentario()"
          [attr.aria-invalid]="comentarioTocado && !!errorComentario()"
          aria-describedby="error-comentario"
          (blur)="comentarioTocado = true"
          placeholder="¿Cómo fue tu estancia? ¿Qué te gustó más del alojamiento y del anfitrión?"
        ></textarea>
        <div class="pie-comentario">
          <span
            class="error-campo"
            id="error-comentario"
            *ngIf="comentarioTocado && errorComentario()"
            >{{ errorComentario() }}</span
          >
          <span class="contador-comentario">{{ longitudComentario() }}/{{ comentarioMax }}</span>
        </div>
      </div>

      <div class="alerta-error" *ngIf="mensajeError" role="alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ mensajeError }}</span>
      </div>
    </div>

    <div class="pie-acciones-resena">
      <button
        class="boton-secundario"
        (click)="cancelarFormulario()"
        [disabled]="enviando"
        type="button"
      >
        Cancelar
      </button>
      <button
        class="boton-primario"
        [disabled]="enviando || (intentoEnviar && !esValido())"
        (click)="enviar()"
        type="button"
      >
        <i class="pi" [ngClass]="enviando ? 'pi-spin pi-spinner' : 'pi-send'"></i>
        {{ enviando ? 'Publicando...' : 'Publicar reseña' }}
      </button>
    </div>
  </div>
</div>
