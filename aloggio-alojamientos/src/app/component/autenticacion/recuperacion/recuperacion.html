<div class="contenedor-recuperacion">
  <div class="ilustracion-fondo-total" aria-hidden="true">
    <svg
      class="linea-trayectoria-total"
      viewBox="0 0 1200 800"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      preserveAspectRatio="none"
    >
      <path
        d="M -100,700 C 300,600 400,200 800,300 C 1000,350 1100,100 1300,50"
        stroke="#31363e"
        stroke-width="2.5"
        stroke-dasharray="8 8"
      />
    </svg>

    <div class="vehiculo-flotante carro-flotante">
      <i class="pi pi-car"></i>
    </div>

    <div class="vehiculo-flotante avion-flotante">
      <i class="pi pi-send"></i>
    </div>
  </div>

  <div class="tarjeta-recuperacion">
    <div class="text-center mb-4">
      <div class="logotipo-centro mb-3">
        <i class="pi pi-building text-dorado fs-2"></i>
      </div>
      <h1 class="titulo-principal">¿Olvidaste tu contraseña?</h1>
      <p class="texto-secundario small">
        Ingresa tu correo electrónico registrado para recibir el código de recuperación.
      </p>
    </div>

    <form (ngSubmit)="alEnviarRecuperacion()" class="d-flex flex-column gap-3">
      <div class="campo-formulario">
        <label for="correo" class="etiqueta-campo">Correo Electrónico</label>
        <div class="grupo-input">
          <span class="icono-input"><i class="pi pi-envelope"></i></span>
          <input
            id="correo"
            [(ngModel)]="correo"
            name="correo"
            type="email"
            class="entrada-control"
            placeholder="nombre@correo.com"
            required
          />
        </div>
      </div>

      <button type="submit" class="boton-dorado py-2 mt-2 fw-semibold">Enviar instrucciones</button>
    </form>

    <div class="text-center mt-4">
      <a routerLink="/inicio-sesion" class="enlace-dorado small text-decoration-none">
        &larr; Volver al inicio de sesión
      </a>
    </div>
  </div>
</div>

<div class="modal-backdrop-aloggio" *ngIf="mostrarModalVerificacion">
  <div class="modal-tarjeta" (click)="$event.stopPropagation()">
    <button type="button" class="boton-cerrar" (click)="mostrarModalVerificacion = false">
      <i class="pi pi-times"></i>
    </button>

    <div class="text-center mb-4">
      <div
        class="logotipo-centro mb-3 mx-auto"
        style="
          width: 50px;
          height: 50px;
          background: rgba(229, 184, 105, 0.1);
          border: 1px solid rgba(229, 184, 105, 0.2);
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
        "
      >
        <i class="pi pi-envelope text-dorado fs-4" style="color: #e5b869"></i>
      </div>
      <h2 class="titulo-principal h4 text-white">Código de verificación</h2>
      <p class="texto-secundario small">
        Ingresa el código de 6 dígitos enviado a <strong class="text-white">{{ correo }}</strong
        >.
      </p>
    </div>

    <form (ngSubmit)="verificarCodigo()" class="d-flex flex-column gap-3">
      <div class="campo-formulario">
        <label class="etiqueta-campo text-center d-block mb-1">Código</label>
        <div class="grupo-input">
          <span class="icono-input"><i class="pi pi-shield"></i></span>
          <input
            type="text"
            [(ngModel)]="codigoVerificacion"
            name="codigoVerificacion"
            class="entrada-control text-center fs-4 tracking-widest"
            placeholder="123456"
            maxlength="6"
            required
          />
        </div>
      </div>

      <button type="submit" class="boton-dorado py-2 mt-2 fw-semibold">Verificar código</button>
    </form>

    <div class="text-center mt-3">
      <button
        type="button"
        class="btn btn-link enlace-dorado small text-decoration-none p-0 border-0 bg-transparent"
        (click)="reenviarCodigo()"
      >
        ¿No recibiste el código? Reenviar
      </button>
    </div>
  </div>
</div>

<div class="modal-backdrop-aloggio" *ngIf="mostrarModalNuevaClave">
  <div class="modal-tarjeta" (click)="$event.stopPropagation()">
    <button type="button" class="boton-cerrar" (click)="mostrarModalNuevaClave = false">
      <i class="pi pi-times"></i>
    </button>

    <div class="text-center mb-4">
      <div
        class="logotipo-centro mb-3 mx-auto"
        style="
          width: 50px;
          height: 50px;
          background: rgba(229, 184, 105, 0.1);
          border: 1px solid rgba(229, 184, 105, 0.2);
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
        "
      >
        <i class="pi pi-lock text-dorado fs-4" style="color: #e5b869"></i>
      </div>
      <h2 class="titulo-principal h4 text-white">Nueva contraseña</h2>
      <p class="texto-secundario small">Ingresa y confirma tu nueva contraseña de acceso.</p>
    </div>

    <form (ngSubmit)="actualizarContrasena()" class="d-flex flex-column gap-3">
      <div class="campo-formulario">
        <label for="nuevaClave" class="etiqueta-campo">Nueva Contraseña</label>
        <div class="grupo-input">
          <span class="icono-input"><i class="pi pi-lock"></i></span>
          <input
            id="nuevaClave"
            [(ngModel)]="nuevaClave"
            name="nuevaClave"
            [type]="mostrarClaveNueva ? 'text' : 'password'"
            class="entrada-control"
            placeholder="••••••••"
            required
          />
          <button type="button" class="boton-peek" (click)="mostrarClaveNueva = !mostrarClaveNueva">
            <i class="pi {{ mostrarClaveNueva ? 'pi-eye-slash' : 'pi-eye' }}"></i>
          </button>
        </div>
      </div>

      <div class="campo-formulario">
        <label for="confirmarClave" class="etiqueta-campo">Confirmar Contraseña</label>
        <div class="grupo-input">
          <span class="icono-input"><i class="pi pi-lock"></i></span>
          <input
            id="confirmarClave"
            [(ngModel)]="confirmarClave"
            name="confirmarClave"
            [type]="mostrarClaveConfirmar ? 'text' : 'password'"
            class="entrada-control"
            placeholder="••••••••"
            required
          />
          <button
            type="button"
            class="boton-peek"
            (click)="mostrarClaveConfirmar = !mostrarClaveConfirmar"
          >
            <i class="pi {{ mostrarClaveConfirmar ? 'pi-eye-slash' : 'pi-eye' }}"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="boton-dorado py-2 mt-2 fw-semibold">
        Guardar nueva contraseña
      </button>
    </form>
  </div>
</div>
