# Base de datos MySQL en Aiven. Se activa con SPRING_PROFILES_ACTIVE=aiven y
# reemplaza solo la conexión de application.properties; lo demás se mantiene.
# La contraseña NUNCA va en este archivo: se lee de la variable de entorno DB_PASSWORD.
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-387ccd63-alloggio.i.aivencloud.com}:${DB_PORT:18708}/${DB_NAME:defaultdb}?sslMode=REQUIRED&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.password=${DB_PASSWORD}

# El plan gratuito admite pocas conexiones simultáneas
spring.datasource.hikari.maximum-pool-size=5

# Render y Railway asignan el puerto con la variable PORT; en local se usa 8081
server.port=${PORT:8081}

# Correo. El plan gratuito de Render bloquea los puertos SMTP 25, 465 y 587, así que en
# el servidor se usa un proveedor que acepte el 2525 (por ejemplo Brevo) con las variables
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD y MAIL_FROM.
# Sin esas variables se usa la configuración de Gmail de application.properties.
app.correo.remitente=${MAIL_FROM:${spring.mail.username}}
spring.mail.properties.mail.smtp.ssl.trust=${spring.mail.host}
# Sin tiempos de espera, un servidor de correo que no responde deja colgada la petición
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
